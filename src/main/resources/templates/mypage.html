<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="stylesheet" href="/css/mypage.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>북적북적 - 마이페이지</title>
    <link rel="icon" href="/images/BookJuk-logo.ico" type="image/x-icon">
    <link rel="icon" th:href="@{/images/BookJuk-logo.ico}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/mypage.css}">
</head>
<body>
    <header class="header">
        <h1 class="logo">북적북적</h1>
        <nav class="user-nav">
            <a href="/" >홈</a>
            <a href="/createMeeting" class="create-meeting-btn">모임 만들기</a>
            <a href="/" >로그아웃</a>
        </nav>
    </header>

    <div class="container">
        <div class="page-header">
            <h1 class="page-title">마이페이지</h1>
            <p class="page-subtitle">나의 독서모임 활동을 확인하고 관리해보세요</p>
        </div>

        <div class="mypage-content">
            <!-- 프로필 섹션 -->
            <div class="profile-section">
                <div class="profile-header">
                    <div class="profile-image" id="profileImage"></div>
                    <div class="profile-name" id="profileName">도도뇽</div>
                    <div class="profile-email" id="profileEmail">user@example.com</div>
                    <div class="profile-bio" id="profileBio">
                        안녕하세요! 책을 사랑하는 도도뇽입니다. 다양한 장르의 책을 읽으며 사람들과 이야기 나누는 것을 좋아해요. 함께 성장할 수 있는 따뜻한 독서모임을 만들고 싶습니다. 📚✨
                    </div>
                </div>

                <div class="profile-genres">
                    <div class="genres-title">선호 장르</div>
                    <div class="genre-tags">
                        <span class="genre-tag">소설</span>
                        <span class="genre-tag">에세이</span>
                        <span class="genre-tag">자기계발</span>
                        <span class="genre-tag">철학</span>
                    </div>
                </div>

                <div class="profile-stats">
                    <div class="stats-title">활동 통계</div>
                    <div class="stats-list">
                        <div class="stat-item">
                            <span class="stat-label">받은 좋아요</span>
                            <span class="stat-number" id="receivedLikes">23</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">참여 모임</span>
                            <span class="stat-number" id="totalMeetings">12</span>
                        </div>
                    </div>
                </div>

                <div class="profile-actions">
                    <button class="btn btn-primary"> <!--onclick="editProfile()"-->
                        프로필 수정
                    </button>
                </div>
            </div>

            <!-- 활동 섹션 -->
            <div class="activity-section">
                <h2 class="section-title">참여한 모임</h2>
                <div class="tabs-container">
                    <div class="tab-content">
                        <div class="meetings-list">
                            <!-- 참여한 모임이 없을 때 표시되는 빈 상태 -->

                            <!-- 기존 미팅 아이템 (참여한 모임이 있을 때만 표시) -->
                            <div class="meeting-item" data-id = "">
                                <div class="meeting-header">
                                    <div class="meeting-info">
                                        <div class="meeting-title">따뜻한 겨울 소설 읽기</div>
                                        <div class="meeting-book">
                                            <span class="book-title">논픽션</span>
                                            <span class="book-author">김영하</span>
                                        </div>
                                        <div class="meeting-meta">
                                            <div class="meeting-meta-item">
                                                <span>◎</span>
                                                <span class="date">2025.08.15 19:00</span>
                                            </div>
                                            <!--<div class="meeting-meta-item">
                                                <span>📍</span>
                                                <span>강남구</span>
                                            </div>-->
                                            <!--<div class="meeting-meta-item">
                                                <span>📚</span>
                                                <span>소설</span>
                                            </div>-->
                                        </div>
                                    </div>
                                    <div class="meeting-status">
                                        <span class="status-badge status-recruiting">모집 중</span>
                                        <span class="role-badge role-participant">호스트</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <script type="module" th:src="@{/js/auth.js}"></script>
    <script type="module" src="/js/mypage.js"></script>
</body>
