<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="stylesheet" href="/css/edit-profile.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>북적북적 - 프로필 수정</title>
    <link rel="stylesheet" th:href="@{/css/edit-profile.css}">
</head>
<body>
    <header class="header">
        <h1 class="logo" onclick="goHome()">북적북적</h1>
        <nav class="nav">
            <a href="#" onclick="goHome()">홈</a>
            <a href="#" onclick="goMyPage()">마이페이지</a>
            <a href="#" class="back-btn" onclick="goBack()">뒤로가기</a>
        </nav>
    </header>

    <div class="container">
        <div class="page-header">
            <h1 class="page-title">✏️ 프로필 수정</h1>
            <p class="page-subtitle">나의 정보를 수정하고 더 나은 독서모임 경험을 만들어보세요</p>
        </div>

        <form class="form-container" id="profileForm">
            <!-- 프로필 이미지 섹션 -->
            <div class="form-section">
                <h2 class="section-title">📷 프로필 이미지</h2>
                
                <div class="profile-image-section">
                    <div class="profile-image" id="profileImage"></div>
                    <div class="image-upload-area">
                        <button type="button" class="file-upload-btn">
                            <span>📷</span>
                            이미지 선택
                        </button>
                        <button type="button" class="remove-image-btn">
                            이미지 제거
                        </button>
                        <input type="file" class="file-input" id="newImage" accept="image/png, image/jpeg" />
                        <div class="image-info">JPG, PNG 파일 (최대 10MB)</div>
                        <div class="error-message" id="imageError" style="display: none;"></div>
                    </div>
                </div>
            </div>

            <!-- 기본 정보 섹션 -->
            <div class="form-section">
                <h2 class="section-title">📋 기본 정보</h2>
                
                <div class="form-group">
                    <label class="form-label">닉네임 <span class="required">*</span></label>
                    <input type="text" class="form-input" id="username" value="도도뇽" placeholder="닉네임을 입력하세요" maxlength="20">
                    <div class="helper-text">최대 20자까지 입력 가능합니다 (중복 허용)</div>
                    <div class="error-message" id="nicknameError" style="display: none;"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">이메일</label>
                    <input type="email" class="form-input" id="email" value="user@example.com" disabled>
                    <div class="helper-text">이메일은 수정할 수 없습니다</div>
                </div>

                <div class="form-group">
                    <label class="form-label">자기소개 (선택)</label>
                    <textarea class="form-textarea" id="introduction" placeholder="간단한 자기소개를 작성해주세요" maxlength="500">안녕하세요! 책을 사랑하는 도도뇽입니다. 다양한 장르의 책을 읽으며 사람들과 이야기 나누는 것을 좋아해요. 함께 성장할 수 있는 따뜻한 독서모임을 만들고 싶습니다. 📚✨</textarea>
                    <div class="helper-text">최대 500자까지 입력 가능합니다</div>
                </div>
            </div>

            <!-- 선호 장르 섹션 -->
            <div class="form-section">
                <h2 class="section-title">📚 선호 장르</h2>
                
                <div class="form-group">
                    <label class="form-label">관심 있는 장르를 선택해주세요 (선택)</label>
                    <div class="radio-group">
                        <div class="radio-item" >
                            <input type="radio" id="genre1" value="소설" name="genre">
                            <label for="genre1">소설</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="genre2" value="에세이" name="genre">
                            <label for="genre2">에세이</label>
                        </div>
                        <div class="radio-item" >
                            <input type="radio" id="genre3" value="자기계발" name="genre">
                            <label for="genre3">자기계발</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="genre4" value="역사" name="genre">
                            <label for="genre4">역사</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="genre5" value="과학" name="genre">
                            <label for="genre5">과학</label>
                        </div>
                        <div class="radio-item" >
                            <input type="radio" id="genre6" value="철학" name="genre">
                            <label for="genre6">철학</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="genre7" value="경제/경영" name="genre">
                            <label for="genre7">경제/경영</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="genre8" value="종교" name="genre">
                            <label for="genre8">종교</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="genre9" value="예술" name="genre">
                            <label for="genre9">예술</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="genre10" value="기타" name="genre">
                            <label for="genre10">기타</label>
                        </div>
                    </div>
                    <div class="helper-text">선호하는 장르를 선택하면 관련 모임을 추천받을 수 있어요</div>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn btn-secondary" id="cancelBtn">취소</button>
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <span id="submitText">프로필 저장</span>
                    <div class="loading-spinner" id="loadingSpinner"></div>
                </button>
            </div>
        </form>

    </div>
    <script type="module" th:src="@{/js/auth.js}"></script>
    <script type="module" src="/js/edit-profile.js"></script>
</body>
